name: Release APK

on:
  release:
    types: [created]
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK (single, universal file)
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacychat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create/update the GitHub release with the APK attached
        if: github.event_name == 'release' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          # A tag with a "-" (e.g. v0.1.0-alpha.25) is a pre-release; a clean
          # "vX.Y.Z" tag is a real release — so App Updater's own
          # releases/latest check can find it without needing its
          # "include pre-releases" option. For the `release: created`
          # trigger (no tag ref to read), fall back to whatever prerelease
          # flag was set when the release was created.
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
